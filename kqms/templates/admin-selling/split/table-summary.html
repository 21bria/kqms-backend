                <tr>
                    <th colspan="3">Grand Total</th>

                    <th id="sum-ni-official" class="text-right">-</th>

                    <th id="sum-fe-official" class="text-right">-</th>

                    <th id="sum-fe-diff-perc" class="text-right">-</th>

                    <th id="sum-sm-official" class="text-right">-</th>

<script type="text/javascript">
    function loadDataSummary() {
        var rowCount = 0; // Jumlah baris
        var table = $("#list-table-summary").find("tbody");
        var grandTotalOre = 0;
        var internalNi = [];
        var internalFe = [];
        var internalSM = [];
        var OfficialNi = [];
        var OfficialFe = [];
        var OfficialSM = [];
        var internalNi_diff = [];
        var internalNi_diff_perc = [];
        var internalFe_diff = [];
        var internalFe_diff_perc = [];
        var internalSM_diff = [];
        var internalSM_diff_perc = [];

        // Bersihkan isi tabel sebelum menambahkan data baru
        table.empty();
        // Fungsi untuk menambahkan data ke tabel
        function appendData(data) {
            grandTotalOre = 0;
            grandTotalPulp = 0;
            grandTotalCoa = 0;
            // Loop melalui data dan tambahkan ke tabel
            $.each(data, function (index, row) {
                var newRow = $("<tr>");
                newRow.append("<td>" + (index + 1) + "</td>"); // Menambahkan nomor urut
                newRow.append("<td>" + formatValue(row.date_barge_out) + "</td>");
                newRow.append("<td>" + formatValue(row.barge_name) + "</td>");
                newRow.append(`<td class="text-right">${parseFloat(row.tonnage_official).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);

                newRow.append(`<td class="text-right">${parseFloat(row.ni_split).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.ni_official).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.ni_diff).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.ni_diff_perc).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);

                newRow.append(`<td class="text-right">${parseFloat(row.fe_split).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.fe_official).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.fe_diff).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.fe_diff_perc).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);

                newRow.append(`<td class="text-right">${parseFloat(row.sm_split).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.sm_official).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.sm_diff).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);
                newRow.append(`<td class="text-right">${parseFloat(row.sm_diff_perc).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`);



                grandTotalOre += parseFloat(row.tonnage_official);
                // grandTotalPulp += parseFloat(row.tonnage_pulp);

                /* Hitung SUM Product */
                internalNi.push(row.tonnage_official * row.ni_split);
                OfficialNi.push(row.tonnage_official * row.ni_official);
                internalNi_diff.push(row.tonnage_official * row.ni_diff);
                internalNi_diff_perc.push(row.tonnage_official * row.ni_diff_perc);

                internalFe.push(row.tonnage_official * row.fe_split);
                OfficialFe.push(row.tonnage_official * row.fe_official);
                internalFe_diff.push(row.tonnage_official * row.fe_diff);
                internalFe_diff_perc.push(row.tonnage_official * row.fe_diff_perc);

                internalSM.push(row.tonnage_official * row.sm_split);
                OfficialSM.push(row.tonnage_official * row.sm_official);
                internalSM_diff.push(row.tonnage_official * row.sm_diff);
                internalSM_diff_perc.push(row.tonnage_official * row.sm_diff_perc);

                // Tambahkan baris ke tabel
                table.append(newRow);

            });

            // Set grand total di bawah footer tabel
            $("#total-ore").text(grandTotalOre.toLocaleString('en-US', { maximumFractionDigits: 2 }));


            // Proses SUM Product Grade
            var sumProduct = function (dataArray) {
                return dataArray.reduce((sum, value) => sum + value, 0);
            };

            // Bagi dengan total 
            var sumResults = [
                { id: "sum-ni-internal", value: (sumProduct(internalNi) / grandTotalOre) || 0 },
                { id: "sum-ni-official", value: (sumProduct(OfficialNi) / grandTotalOre) || 0 },
                { id: "sum-ni-diff", value: (sumProduct(internalNi_diff) / grandTotalOre) || 0 },
                { id: "sum-ni-diff-perc", value: (sumProduct(internalNi_diff_perc) / grandTotalOre) || 0 },

                { id: "sum-fe-internal", value: (sumProduct(internalFe) / grandTotalOre) || 0 },
                { id: "sum-fe-official", value: (sumProduct(OfficialFe) / grandTotalOre) || 0 },
                { id: "sum-fe-diff", value: (sumProduct(internalFe_diff) / grandTotalOre) || 0 },
                { id: "sum-fe-diff-perc", value: (sumProduct(internalFe_diff_perc) / grandTotalOre) || 0 },

                { id: "sum-sm-internal", value: (sumProduct(internalSM) / grandTotalOre) || 0 },
                { id: "sum-sm-official", value: (sumProduct(OfficialSM) / grandTotalOre) || 0 },
                { id: "sum-sm-diff", value: (sumProduct(internalSM_diff) / grandTotalOre) || 0 },
                { id: "sum-sm-diff-perc", value: (sumProduct(internalSM_diff_perc) / grandTotalOre) || 0 },

            ];

            sumResults.forEach(result => {
                $("#" + result.id).text(result.value.toLocaleString('en-US', { maximumFractionDigits: 2 }));
            });
        }

        // Lakukan permintaan Ajax ke endpoint controller Anda
        var table = $("#list-table-summary").find("tbody");
        table.empty();
        var typeFilter = $('#typeFilter').val();
        var startDate = $('#startDate').val();
        var endDate = $('#endDate').val();
        var codeFilter = $('#codeFilter').val();

        // Menjalankan filter berdasarkan parameter yang dipilih
        $.ajax({
            type: "GET",
            url: "{% url 'selling-monitoring-sample-list'%}",
            data: {
                typeFilter: typeFilter,
                codeFilter: JSON.stringify(codeFilter), // Convert to JSON string,
                startDate: startDate,
                endDate: endDate
            },
            success: function (response) {
                // Data berhasil diterima dari server
                table.empty();
                var sqlData = response.data;
                appendData(sqlData);
            },
            error: function () {
                console.log("Gagal mengambil data dari server.");
            },
        });
    }

</script>
