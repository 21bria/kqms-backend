<style>
    [data-nav-layout=horizontal] .content {
        inset-inline-start: 0px !important;
        margin-left: auto !important;

    /* Custom DataTable pagination agar sesuai Tailwind */
    /* Tambahkan jarak bawah keseluruhan */

        padding-bottom: 1.5rem;
        /* atau coba 2rem jika masih terlalu mepet */
    }

        margin-bottom: 2rem;
        /* jarak bawah */
    }

    /* Tombol Pagination */
    .dataTables_wrapper .dataTables_paginate .paginate_button {
        padding: 0.5rem 0.75rem;
        margin: 0 0.10rem;
        border-radius: 0.375rem;
        background-color: white;
        border: 1px solid #e5e7eb;
        color: #374151;
        font-weight: 500;
    }

    .dark .dataTables_wrapper .dataTables_paginate .paginate_button {
        background-color: #1f2937;
        /* bg-gray-800 */
        border-color: #374151;
        /* border-gray-700 */
        color: #d1d5db;
        /* text-gray-300 */
    }

    /* Tombol aktif */
    .dataTables_wrapper .dataTables_paginate .paginate_button.current {
        background-color: #6366f1;
        color: white !important;
        border-color: #6366f1;
    }

    .dark .dataTables_wrapper .dataTables_paginate .paginate_button.current {
        background-color: #818cf8;

        border-color: #6366f1;
        color: #111827 !important;

    }

    /* Filter input dan select dropdown */
    .dataTables_wrapper .dataTables_filter input,
    .dataTables_wrapper .dataTables_length select {
        border: 1px solid #e5e7eb;

        border-radius: 0.375rem;
        background-color: white;
        color: #111827;
    }

    .dark .dataTables_wrapper .dataTables_filter input,
    .dark .dataTables_wrapper .dataTables_length select {
        background-color: #1f2937;

        font-size: 0.875rem;

    }

    .dark .dataTables_wrapper .dataTables_length label,
    .dark .dataTables_wrapper .dataTables_filter {
        color: #d1d5db;
    }

    /* Margin bawah & atas */

        margin-bottom: 1rem;

    }

    .dataTables_wrapper .dataTables_length {
        margin-bottom: 1rem;
    }

        font-size: 0;

    }

    .dataTables_wrapper .dataTables_length label select {
        font-size: 0.875rem;
        /* Kembalikan ukuran font dropdown */
    }

    .custom-popup {
        padding: 1.5rem !important;
        border-radius: 1rem !important;
        background-color: #2f3052 !important;
        color: #ffffff !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
    }

    .custom-icon {
        border: 4px solid #ff6b6b !important;

        font-size: 1.1rem !important;

    #toast-container {

        /* right-5 */

    }

    .select2-container {
        z-index: 999999 !important;
    }

    .select2-dropdown {
        z-index: 999999 !important;
    }

    /* Khusus untuk HSOverlay modal */
    .select2-container--open .select2-dropdown {
        z-index: 99999999 !important;
    }

    .swal2-popup {
        flex-direction: column;
        justify-content: center;
        padding: 20px !important;
        box-sizing: border-box;
    }

    .dark .swal2-popup {
        background: #0e1726;
    }

    .dark .swal2-popup .swal2-title {
        color: #888ea8;
    }

    .swal2-popup .swal2-title {
        display: block;
        margin: 0 !important;
        width: 100%;
        color: #3b3f5c;
        font-size: 24px;
    }

    :is([dir="ltr"] .swal2-popup .swal2-title) {
        padding-right: 2.5rem !important;
    }

    :is([dir="rtl"] .swal2-popup .swal2-title) {
        padding-left: 2.5rem !important;
    }

    .swal2-popup .swal2-styled {
        box-shadow: 0 5px 20px 0 #0000001a !important;
        letter-spacing: 1px;
        font-size: 14px !important;
        line-height: 20px !important;
        transition: all 0.3s ease-out;
        -webkit-transition: all 0.3s ease-out;
        margin: 0 5px;
        padding: 8px 20px;
        border-radius: 6px;
    }

    .swal2-popup .swal2-styled.swal2-cancel {
        background-color: #fff !important;
        color: #4361ee;
        border: 1px solid #e8e8e8;
        box-shadow: none;
        padding: 7px 20px;
    }

    .dark .swal2-popup .swal2-styled.swal2-cancel {
        background-color: #3b3f5c !important;
        color: #e0e6ed;
        border-color: #3b3f5c;
    }

    .swal2-popup .swal2-styled.swal2-confirm {
        background-color: #4361ee;
    }

    .swal2-popup .swal2-styled.swal2-confirm:focus {
        box-shadow: none !important;
    }

    .swal2-popup .swal2-html-container {
        margin: 0 !important;
        color: #e95f2b;
        font-weight: 300;
    }

    :is([dir="ltr"] .swal2-popup .swal2-html-container) {
        padding-right: 2.5rem !important;
    }

    :is([dir="rtl"] .swal2-popup .swal2-html-container) {
        padding-left: 2.5rem !important;
    }

    .swal2-popup .swal2-close {
        position: absolute;
        top: 16px;
        transition: color 0.1s ease-out;
        font-family: serif;
    }

    :is([dir="ltr"] .swal2-popup .swal2-close) {
        right: 1rem;
    }

    :is([dir="rtl"] .swal2-popup .swal2-close) {
        left: 1rem;
    }

    .dark .swal2-popup .swal2-close {
        color: #888ea8;
    }

    .swal2-popup.swal2-toast {
        flex-direction: row;
        align-items: center;
        width: auto !important;
        box-shadow: 0 0 0.625em #d9d9d9;
        padding: 2em;
        overflow-y: hidden;
        display: flex !important;
    }

    .swal2-popup.swal2-toast.swal2-show {
        animation: showSweetToast 0.5s;
    }

    .swal2-popup pre {
        color: #009688;
    }

    .swal2-icon {
        position: relative;
        box-sizing: initial;
        justify-content: center;
        width: 5em;
        height: 5em;
        margin: 1.25em auto 1.875em;
        border-radius: 50%;
        border: 0.25em solid #000;
        font-family: inherit;
        line-height: 5em;
        cursor: default;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
    }

    .swal2-icon:not(.swal2-error):not(.swal2-success) {
        width: 2em !important;
        line-height: 119px !important;
        height: 2em !important;
        margin: 0.25em auto 0.875em !important;
    }

    .swal2-icon.swal2-error {
        border: 5px solid #f1f2f3 !important;
        box-shadow: 0 3px 25px 0 #716aca33;
    }

    .swal2-icon.swal2-warning {
        color: #fb4 !important;
    }

    .swal2-icon.swal2-info,
    .swal2-icon.swal2-warning {
        border: 5px solid #f1f2f3 !important;
        box-shadow: 0 3px 25px 0 #716aca33;
        font-size: 60px;
        line-height: 80px;
        text-align: center;
    }

    .swal2-icon.swal2-info {
        color: #4361ee !important;
    }

    .swal2-icon.swal2-question {
        color: #805dca !important;
        border-style: solid;
        border-width: 4px !important;
        border-color: #0000 !important;
        box-shadow: 0 3px 25px 0 #716aca33;
        font-size: 60px;
        line-height: 80px;
        text-align: center;
    }

    .dark .swal2-icon.swal2-error,
    .dark .swal2-icon.swal2-info,
    .dark .swal2-icon.swal2-question,
    .dark .swal2-icon.swal2-warning {
        border-color: #888ea8 !important;
        box-shadow: none !important;
    }

    .swal2-iconswal2-success [class^="swal2-success-line"][class$="tip"] {
        top: 2.875em;
        left: 0.875em;
        width: 1.5625em;
        transform: rotate(45deg);
    }

    .swal2-icon.swal2-success swal2-success [class^="swal2-success-line"][class$="long"] {
        top: 2.375em;
        right: 0.5em;
        width: 2.9375em;
        transform: rotate(-45deg);
    }

    .swal2-icon.swal2-success .swal2-success-fix {
        position: absolute;
        top: 0.5em;
        left: 1.625em;
        width: 0.4375em;
        height: 5.625em;
        transform: rotate(-45deg);
        z-index: 1;
    }

    .swal2-icon.swal2-success .swal2-success-ring {
        position: absolute;
        top: -0.25em;
        left: -0.25em;
        width: 100%;
        height: 100%;
        border: 0.25em solid #a5dc864d;
        border-radius: 50%;
        z-index: 2;
        box-sizing: initial;
    }

    .swal2-icon.swal2-success [class^="swal2-success-circular-line"][class$="right"] {
        top: -0.6875em;
        left: 1.875em;
        transform: rotate(-45deg);
        transform-origin: 0 3.75em;
        border-radius: 0 7.5em 7.5em 0;
    }

    .swal2-progress-steps .swal2-progress-step.swal2-active-progress-step {
        background: #25d5e4 !important;
    }

    .swal2-progress-steps .swal2-progress-step.swal2-active-progress-step~.swal2-progress-step {
        background: #ebedf2 !important;
    }

    .dark .swal2-progress-steps .swal2-progress-step.swal2-active-progress-step~.swal2-progress-step {
        background: #3b3f5c !important;
        color: #888ea8 !important;
    }

    .dark .swal2-progress-steps .swal2-progress-step {
        color: #e0e6ed;
    }

    .swal2-icon-content {
        font-size: 5.75rem !important;
    }

    .swal2-show {
        animation: swal2-show 0.3s;
    }

    .swal2-modal.background-modal .swal2-title {
        color: #fff !important;
    }

    .dark .swal2-input {
        background-color: #1b2e4b;
        border-color: #253b5c;
        color: #888ea8;
    }

    .dark .swal2-footer {
        border-color: #888ea8;
    }

    .swal2-image {
        margin-bottom: 32px !important;
    }

    .sweet-alerts.swal2-popup .swal2-html-container {
        margin-top: 1rem !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    :is([dir="ltr"] .sweet-alerts.swal2-popup .swal2-title) {
        padding-right: 1.5rem !important;
    }

    :is([dir="rtl"] .sweet-alerts.swal2-popup .swal2-title) {
        padding-left: 1.5rem !important;
    }

    /* Select 2 */
    .select2-container {
        z-index: 999999 !important;
    }

    .select2-dropdown {
        z-index: 999999 !important;
    }

    /* Khusus untuk HSOverlay modal */
    .select2-container--open .select2-dropdown {
        z-index: 99999999 !important;
    }

    /* Styling untuk Select2 container */
    .select2-container {
        width: 100% !important;
    }

    /* Styling untuk Select2 selection */
    .select2-container--default .select2-selection--single {
        height: 40px !important;
        border: 1px solid #d1d5db !important;
        border-radius: 6px !important;
        display: flex !important;
        align-items: center !important;
        padding: 0 12px !important;
        background-color: #fff !important;
    }

    /* Styling untuk rendered text (teks yang dipilih) */
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        color: #374151 !important;
        line-height: normal !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center !important;
        height: 100% !important;
    }

    /* Styling untuk placeholder */
    .select2-container--default .select2-selection--single .select2-selection__placeholder {
        color: #9ca3af !important;
    }

    /* Styling untuk tombol clear (X) */
    .select2-container--default .select2-selection--single .select2-selection__clear {
        position: absolute !important;
        right: 30px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        width: 20px !important;
        height: 20px !important;
        border-radius: 50% !important;
        background-color: #f3f4f6 !important;
        color: #6b7280 !important;
        text-align: center !important;
        line-height: 18px !important;
        font-size: 14px !important;
        font-weight: bold !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }

    .select2-container--default .select2-selection--single .select2-selection__clear:hover {
        background-color: #e5e7eb !important;
        color: #374151 !important;
    }

    /* Styling untuk dropdown arrow */
    .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 100% !important;
        position: absolute !important;
        top: 0 !important;
        right: 8px !important;
        width: 20px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }

    .select2-container--default .select2-selection--single .select2-selection__arrow b {
        border-color: #6b7280 transparent transparent transparent !important;
        border-style: solid !important;
        border-width: 5px 4px 0 4px !important;
        height: 0 !important;
        left: 0 !important;
        margin-left: 0 !important;
        margin-top: 0 !important;
        position: relative !important;
        top: 0 !important;
        width: 0 !important;
    }

    /* Styling untuk dropdown */
    .select2-dropdown {
        border: 1px solid #d1d5db !important;
        border-radius: 6px !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
    }

    /* Styling untuk search box di dropdown */
    .select2-search--dropdown .select2-search__field {
        border: 1px solid #d1d5db !important;
        border-radius: 4px !important;
        padding: 8px 12px !important;
        margin: 8px !important;
        width: calc(100% - 16px) !important;
    }

    /* Styling untuk options */
    .select2-results__option {
        padding: 8px 12px !important;
        color: #374151 !important;
    }

    .select2-results__option--highlighted {
        background-color: #6466f1 !important;
        color: white !important;
    }

    /* Styling untuk container dengan allowClear */
    .select2-container--default.select2-container--allowclear .select2-selection--single .select2-selection__rendered {
        padding-right: 50px !important;
        /* Beri ruang untuk tombol clear dan arrow */
    }

    /* Styling khusus untuk multiple select jika diperlukan */
    .select2-container--default .select2-selection--multiple {
        min-height: 40px !important;
        border: 1px solid #d1d5db !important;
        border-radius: 6px !important;
        padding: 4px 8px !important;
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice {
        background-color: #6466f1 !important;
        border: 1px solid #6466f1 !important;
        border-radius: 4px !important;
        color: white !important;
        padding: 2px 8px !important;
        margin: 2px !important;
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
        color: white !important;
        margin-right: 6px !important;
        font-weight: bold !important;
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
        color: #fecaca !important;
    }

    /* Styling untuk focus state */
    .select2-container--default.select2-container--focus .select2-selection--single {
        border-color: #6466f1 !important;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1) !important;
    }

    /* Styling untuk disabled state */
    .select2-container--default.select2-container--disabled .select2-selection--single {
        background-color: #f9fafb !important;
        color: #9ca3af !important;
        cursor: not-allowed !important;
    }
</style>

<body>
    <!-- ========== Switcher  ========== -->
    {% include 'layout/switcher.html' %}
    <!-- ========== END Switcher  ========== -->

    <!-- Loader -->
    <div id="loader">
        <img src="{% static 'assets/images/media/loader.svg' %}" alt="">
    </div>
    <!-- Loader -->
    <div class="page">
        <div class="content">
            <!-- Start::main-content -->
            <div class="main-content">
                <!-- Page Header -->
                <div class="block justify-between page-header md:flex">
                    <div>
                        <h3
                            class="!text-defaulttextcolor dark:!text-defaulttextcolor/70 dark:text-white dark:hover:text-white text-[1.125rem] font-semibold">
                            Barging</h3>
                    </div>
                    <ol class="flex items-center whitespace-nowrap min-w-0">
                        <li class="text-[0.813rem] ps-[0.5rem]">
                            <a class="flex items-center text-primary hover:text-primary dark:text-primary truncate"
                                href="javascript:void(0);">
                                Form
                                <i
                                    class="ti ti-chevrons-right flex-shrink-0 text-[#8c9097] dark:text-white/50 px-[0.5rem] overflow-visible rtl:rotate-180"></i>
                            </a>
                        </li>
                        <li class="text-[0.813rem] text-defaulttextcolor font-semibold hover:text-primary dark:text-[#8c9097] dark:text-white/50"
                            aria-current="page">Ore
                        </li>
                    </ol>
                </div>
                <!-- Page Header Close -->

                <!-- Start::row-1 -->
                <div class="grid grid-cols-12 gap-6">
                    <div class="col-span-12">
                        <div class="box">
                            <div class="box-header">
                                <h5 class="box-title">Entry data</h5>
                            </div>
                            <div class="box-body">
                                <form id="multiRowForm" class="mt-5">
                                    <div class="flex justify-start">
                                        <div class="w-64">
                                            <label for="hs-trailing-button-add-on-with-icon"
                                                class="sr-only">Label</label>
                                            <div class="flex rounded-sm">
                                                <input type="text" id="no_production" name='no_production'
                                                    value="BG-{{ no_entry }}"
                                                    class=" ti-form-control w-full !rounded-md rounded-none rounded-s-sm focus:z-10 w-full">
                                                <button aria-label="button" type="button" id="applyFilterBtn"
                                                    class="inline-flex flex-shrink-0 justify-center items-center h-[2.875rem] w-[2.875rem] rounded-e-sm border border-transparent font-semibold bg-primary text-white hover:bg-primary focus:z-10 focus:outline-none focus:ring-0 focus:ring-primary transition-all text-sm">
                                                    <svg class="h-3 w-3" xmlns="http://www.w3.org/2000/svg" width="16"
                                                        height="16" fill="currentColor" viewBox="0 0 16 16">
                                                        <path

                ],

             // Menambahkan opsi footerCallback
                "footerCallback": function (row, data, start, end, display) {
                    var api = this.api(),
                        data;
                    // converting to interger to find total
                    var intVal = function (i) {
                        return typeof i === 'string' ?
                            i.replace(/[\$,]/g, '') * 1 :
                            typeof i === 'number' ?
                                i : 0;
                    };
                    // computing column Total the complete result 

                    var col_10 = api
                        .column(10)
                        .data()
                        .reduce(function (a, b) {
                            return intVal(a) + intVal(b);
                        }, 0);
                    var col_11 = api
                        .column(11)
                        .data()
                        .reduce(function (a, b) {
                            return intVal(a) + intVal(b);
                        }, 0);

                    // Update footer by showing the total with the reference of the column index   
                    $(api.column(10).footer()).html(col_10.toString().replace(
                        /\B(?=(\d{3})+(?!\d))/g,
                        ","));
                    $(api.column(11).footer()).html(col_11.toString().replace(
                        /\B(?=(\d{3})+(?!\d))/g,
                        ","));

                    });
                    $('#vendorsEdit').append(options).select2({
                        width: '100%'
                    });
                }
            });


            let bucket_capacity = 0;  // simpan tf_ton global sementara
            let density_lcm = 0;  // simpan tf_ton global sementara

            $('#hauler_class, #id_material').on('change', function () {
                const hauler = $('#hauler_class').val();
                const materialText = $('#id_material option:selected').text();

                if (hauler && materialText) {
                    $.ajax({
                        url: "{% url 'get-hauler-factor' %}",
                        type: 'GET',
                        data: {
                            hauler_class: hauler,
                            material: materialText.trim()
                        },
                        success: function (response) {
                            console.log('Data diterima:', response);

                            if (response.list.length > 0) {
                                const data = response.list[0];

                                bucket_capacity = parseFloat(data.bucket_capacity) || 0;
                                density_lcm = parseFloat(data.density_lcm) || 0;
                                // Isi ton langsung jika ritase sudah diisi sebelumnya
                                const ritase = parseFloat($('#ritase').val()) || 0;
                                const parsing = parseFloat($('#bucket').val()) || 0;
                                $('#tonnage').val((parsing * ritase * bucket_capacity * density_lcm).toFixed(2));
                            } else {
                                bucket_capacity = 0;
                                density_lcm = 0;
                                $('#tonnage').val('');
                            }
                        },
                        error: function (xhr) {
                            console.error('Gagal ambil data:', xhr.responseText);
                            bucket_capacity = 0;
                            density_lcm = 0;
                            $('#tonnage').val('');
                        }
                    });
                }
            });
            // Ketika ritase diketik, hitung ulang ton
            $('#ritase').on('input', function () {
                const ritase = parseFloat($(this).val()) || 0;
                const parsing = parseFloat($('#bucket').val()) || 0;
                const ton = (parsing * ritase * bucket_capacity * density_lcm).toFixed(2);
                $('#tonnage').val(ton);
            });
            $('#bucket').on('input', function () {
                const parsing = parseFloat($(this).val()) || 0;
                const ritase = parseFloat($('#ritase').val()) || 0;
                const ton = (parsing * ritase * bucket_capacity * density_lcm).toFixed(2);
                $('#tonnage').val(ton);
            });

            $('#sources').change(function (e) {
                var selectedSource = $(this);
                var inputArea = $('#area');
                var selectedText = selectedSource.find(':selected').text();
                inputArea.val(selectedText);
