<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    let map;
    let geojsonLayer;
    let iupLayer = null;
    let sourceLayer = null;
    function initMap() {
        map = L.map('map');

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // ambil lokasi user
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.setView([lat, lng], 14);
                    L.circleMarker([lat, lng], {
                        radius: 6,
                        color: 'blue',
                        fillOpacity: 0.8
                    }).addTo(map).bindPopup("Lokasi Anda").openPopup();
                },
                function () {
                    fallbackLocation();
                }
            );
        } else {
            fallbackLocation();
        }
    }

    function fallbackLocation() {
        // fallback ke lokasi tambang / kantor
        map.setView([-0.07, 129.41], 12);
    }

    $(document).ready(function () {
        initMap();
    });
</script>

<script type="text/javascript">
    $(document).ready(function () {
        loadIUP(1); // <-- id_iup
        // CSRF
        $.ajaxSetup({
            headers: {
                'X-CSRFToken': $('meta[name="csrf-token"]').attr('content')
            }
        });
        $.ajax({
            url: "{% url 'get-mine-iup' %}",
            method: "GET",
            dataType: "json",
            success: function (data) {
                var options = '';
                $.each(data.results, function (key, value) {
                    options += '<option value="' + value.id + '">' + value.text + '</option>';
                });
                $('#id_iup').append(options).select2({
                    width: '100%',
                });
            }
        });

        $('#id_iup').on('change', function () {
            const iupId = $(this).val();
            if (!iupId) {
                 Swal.fire({
                        title: 'Opss!',
                        text: 'Silakan pilih IUP dulu.',
                        icon: 'info',
                        width: 380,
                    })
                return;
            }
            loadIUP(iupId);
        });
    });
    const SOURCE_COLORS = [
        '#22c55e', '#3b82f6', '#f97316',
        '#a855f7', '#ec4899', '#14b8a6',
        '#eab308', '#ef4444'
    ];

    function getSourceColor(sourceId) {
        return SOURCE_COLORS[sourceId % SOURCE_COLORS.length];
    }

    function loadIUP(iupId) {
        $.getJSON(`/kqms/gis/api/mine-iup/${iupId}/`, function (res) {
            // ===== clear layer lama =====
            if (iupLayer) map.removeLayer(iupLayer);
            if (sourceLayer) map.removeLayer(sourceLayer);

            // ===== IUP layer =====
            iupLayer = L.geoJSON(res.iup, {
                style: {
                    color: '#16a34a',
                    weight: 2,
                    fillOpacity: 0.15
                }
            }).addTo(map);
            map.fitBounds(iupLayer.getBounds(), { padding: [30, 30] });

            // ===== Sources layer =====
            sourceLayer = L.geoJSON(res.sources, {
                style: function (feature) {
                    return {
                        color: getSourceColor(feature.properties.id),
                        weight: 2,
                        fillOpacity: 0.5,
                        dashArray: '3'
                    };
                },
                onEachFeature: function (feature, layer) {
                    const p = feature.properties || {};
                    const productions = p.productions || {};
                    const materials = productions.materials || [];
                    const totalTonnage = productions.total || 0;

                    let productionHtml = '<i>No production</i>';
                    if (materials.length > 0) {
                        productionHtml = '<table style="width:100%; font-size:12px; margin-top:6px"><thead><tr><th align="left">Material</th><th align="right">Tonnage</th></tr></thead><tbody>';
                        materials.forEach(function (m) {
                            productionHtml += `<tr><td>${m.material}</td><td align="right">${m.tonnage.toLocaleString()}</td></tr>`;
                        });
                        productionHtml += `<tfoot><tr style="font-weight:bold; border-top:1px solid #ccc"><td>Total</td><td align="right">${totalTonnage.toLocaleString()}</td></tr></tfoot></tbody></table>`;
                    }

                    layer.bindPopup(`
                    <div style="min-width:220px">
                        <b>Source:</b> ${p.sources_area || '-'}<br>
                        <b>PIT:</b> ${p.pit || '-'}<br>
                        <b>Area:</b> ${p.luas_ha ?? '-'} ha
                        <hr style="margin:4px 0"/>
                        <b>Production:</b>
                        ${productionHtml}
                    </div>
                `);
                }
            }).addTo(map);
        }).fail(function () {
            Swal.fire("Error", "Gagal load data IUP", "error");
        });
    }

</script>
